# Render Blueprint. Set secret values in Render, never in this file.
services:
  - type: web
    name: calibrateiq
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        postgresql://postgres.ksuicusydumcyurndxah:Sewminaex21@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_API_KEY          850b095469383c8139925bf0150334b3
        sync: false
      - key: AI_SERVICE_URL      https://calibrateiq-ai.onrender.com
        sync: false
      - key: LAB_NAME            Precision Calibration Laboratory
        sync: false
      - key: LAB_ADDRESS         No. 25, Galle Road, Colombo 03, Sri Lanka
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
  - type: web
    name: calibrateiq-ai
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt && python generate_dataset.py && python train.py
    startCommand: gunicorn -b 0.0.0.0:$PORT --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: AI_API_KEY  850b095469383c8139925bf0150334b3
        sync: false
